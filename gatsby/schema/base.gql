type MarkdownRemarkFields {
    slug: String!
}

type MarkdownRemark implements Node {
    fields: MarkdownRemarkFields!
    frontmatter: Frontmatter!
}

type Frontmatter {
    date: Date @dateformat
    title: String!
    description: String
    draft: Boolean
    tags: [String!]
    title: String!
}

type ResourceLink {
    name: String!
    url: String!
    description: String
}

type Resource implements Node {
    slug: String!
    name: String
    type: String
    altText: String
    description: String
    shortDescription: String
    draft: Boolean
    file: String
    host: String
    imageFile: File @fileByRelativePath
    imageUrl: String
    name: String
    links: [ResourceLink!]
    readmeLink: String
    slug: String!
    status: String
    tags: [String!]
    type: String
    viewerUrl: String
}

type PreliminaryFindings {
    figures: [ImgWithCaption!]!
    summary: String!
}

type ImgWithCaption @dontInfer {
    caption: String
    file: File @fileByRelativePath
    type: String!
    url: String
}

type IdeaResourceNote {
    resource: Resource
    relevance: String
}

type IdeaPost implements Node {
    accelerator: [String!]!
    authors: [Allenite!]!
    date: Date @dateformat
    description: String
    draft: Boolean
    flagshipResources: [Resource!]!
    introduction: String
    maturity: String
    nextSteps: String
    preliminaryFindings: PreliminaryFindings
    primaryContact: Allenite
    program: [String!]!
    publication: String
    relatedIdeas: [IdeaPost!]!
    researcherLevel: [String!]!
    resourceNotes: [IdeaResourceNote!]!
    resources: [Resource!]!
    scope: String
    slug: String!
    tags: [String!]!
    title: String!
    type: String
}

type Allenite implements Node {
    slug: String!
    name: String!
    contactId: String
    position: String
    contact: String
    program: [String!]
}
